name: Django String Renderer Build and Test

on:
  push:
    branches:
    - master
    - features/**
    - dependabot/**
  pull_request:
    branches:
    - master

permissions:
  contents: read

# Cancel the run in progress when a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        exclude:
        # Django 6.0 and later require Python 3.12 or later.
        - python-version: '3.10'
          django-version: '6.0'
        - python-version: '3.10'
          django-version: '6.1'
        - python-version: '3.11'
          django-version: '6.0'
        - python-version: '3.11'
          django-version: '6.1'

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      env:
        DJANGO_VERSION: ${{ matrix.django-version }}
      run: python -m pip install "django==${DJANGO_VERSION}.*" -r requirements-dev.txt

    - name: Run tests and type checking
      run: python runtests.py
